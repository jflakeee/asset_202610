<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trailwood 보상 실험실</title>
<style>*{box-sizing:border-box}body{margin:0;background:#15231d;color:#f0eadb;font:16px system-ui}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:clamp(24px,6vw,38px)}button,a{touch-action:manipulation}button{min-height:48px;border:1px solid #839477;border-radius:10px;background:#324a39;color:#fff;padding:10px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:#dfc48a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.card{background:#24382b;border-radius:14px;padding:16px;text-align:center}.card img{width:96px;height:96px}.card button{width:100%}.card p{min-height:24px}header,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.actions{margin:20px 0}.pulse{animation:pulse .35s ease-out}@keyframes pulse{50%{background:#5c7041;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}#notice{min-height:48px;padding:12px;border-left:3px solid #d6af4c}progress{width:min(260px,100%);height:22px}small{color:#c4cdbf}</style>
<main><a href="index.html">← 모델 갤러리</a><h1>숲에서 얻은 작은 보상</h1><p>아이템을 획득하고, 회복약과 보물상자를 사용해 보세요.</p><header><strong id="health"></strong><progress id="bar" max="100"></progress></header><div class="actions"><button id="damage">피해 받기</button><button id="heal">회복약 사용 +30</button><button id="chest">상자 열기 · 동전 10</button><button id="wave">새 드롭 생성</button><button id="reset">처음부터</button></div><p id="notice" role="status" aria-live="polite">아래 아이템을 누르면 인벤토리에 추가됩니다.</p><section aria-label="제작"><h2>보물상자 제작</h2><p>시험 제작법: 통나무 2 + 철광석 1 + 밧줄 1 → 상자 1</p><p id="ingredients"></p><button id="craft">보물상자 제작</button></section><section class="grid" id="cards" aria-label="아이템과 인벤토리"></section><p><small>2D 아이콘 기반 기능 예제입니다. 3D 월드 이동·상자 모델 애니메이션·효과음·저장은 포함하지 않습니다. 새로고침하면 초기화됩니다.</small></p></main>
